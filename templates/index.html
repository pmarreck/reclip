<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReClip — Free Media Downloader</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1eb;
      --fg: #3a3a38;
      --accent: #e85d2a;
      --accent-hover: #d04e1f;
      --muted: #9c9889;
      --card: #fff;
      --card-border: #e2ded6;
      --success: #2d8a4e;
      --error: #c43d3d;
      --radius: 14px;
      --shimmer: linear-gradient(90deg, #ebe8e2 25%, #f0ede7 50%, #ebe8e2 75%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      opacity: 0.03;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 128px;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    .brand { margin-bottom: 48px; }
    .brand h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 4.2rem;
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--fg);
    }
    .brand h1 em { font-style: italic; color: var(--accent); }
    .brand h1 .plus {
      color: var(--accent);
      font-style: normal;
      font-size: 0.7em;
      vertical-align: super;
      margin-left: 4px;
    }

    /* Constrain input/controls to readable width */
    .input-section { max-width: 700px; }

    /* Cards go full width and grow thumbs on wider screens */
    .cards { max-width: 100%; }
    @media (min-width: 900px) {
      .card-thumb { width: 200px; min-width: 200px; height: 120px; }
    }
    .brand p {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      padding: 18px 20px;
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--fg);
      font-family: 'DM Mono', monospace;
      font-size: 0.88rem;
      outline: none;
      resize: none;
      min-height: 56px;
      transition: border-color 0.25s, box-shadow 0.25s;
      margin-bottom: 6px;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232, 93, 42, 0.08);
    }
    textarea::placeholder { color: var(--muted); }

    .hint {
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 6px;
      align-items: center;
    }
    .pill-group {
      display: flex;
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--card);
    }
    .pill {
      padding: 9px 18px;
      font-family: 'DM Mono', monospace;
      font-size: 0.76rem;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .pill.active { background: var(--fg); color: var(--bg); }
    .pill:not(.active):hover { color: var(--fg); }

    .fetch-btn {
      flex: 1;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .fetch-btn:hover { background: var(--accent-hover); }
    .fetch-btn:active { transform: scale(0.98); }
    .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Cards */
    .cards { margin-top: 24px; }

    .card {
      display: flex;
      gap: 14px;
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      background: var(--card);
      padding: 14px;
      margin-bottom: 10px;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-thumb {
      width: 120px;
      min-width: 120px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--card-border);
      flex-shrink: 0;
      position: relative;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* No-thumbnail icon */
    .card-thumb .no-thumb {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
    .card-thumb .no-thumb svg {
      width: 28px;
      height: 28px;
      opacity: 0.5;
    }

    /* Shimmer skeleton for loading state */
    .card-thumb.loading {
      background: var(--shimmer);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    .skeleton-line {
      height: 12px;
      border-radius: 4px;
      background: var(--shimmer);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      margin-bottom: 6px;
    }
    .skeleton-line.short { width: 40%; height: 10px; }
    .skeleton-line.medium { width: 75%; }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card-title {
      font-family: 'Instrument Serif', serif;
      font-size: 1rem;
      line-height: 1.3;
      color: var(--fg);
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-meta {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .card-dl-btn {
      padding: 6px 14px;
      border: none;
      border-radius: 7px;
      background: var(--fg);
      color: var(--bg);
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .card-dl-btn:hover { background: #2d2d2a; }
    .card-dl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .card-dl-btn.done { background: var(--success); color: #fff; }
    .card-dl-btn.error { background: var(--error); color: #fff; }

    .card-btn-alt {
      background: transparent;
      color: var(--fg);
      border: 1.5px solid var(--card-border);
    }
    .card-btn-alt:hover { background: rgba(26,26,24,0.04); border-color: var(--fg); }

    .op-result {
      margin-top: 8px;
      padding: 10px 12px;
      border: 1.5px solid var(--card-border);
      border-radius: 8px;
      background: rgba(26,26,24,0.02);
      position: relative;
    }
    .op-result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .op-result-label {
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .op-result-text {
      font-size: 0.78rem;
      line-height: 1.5;
      color: var(--fg);
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
    }
    .op-result-text.expanded { max-height: none; }
    .op-result-toggle {
      font-size: 0.65rem;
      color: var(--accent);
      cursor: pointer;
      border: none;
      background: none;
      font-family: 'DM Mono', monospace;
      padding: 2px 0;
    }
    .op-result-toggle:hover { text-decoration: underline; }

    .card-status {
      font-size: 0.68rem;
      color: var(--muted);
    }
    .card-status.downloading { color: var(--accent); }
    .card-status.done { color: var(--success); }
    .card-status.error { color: var(--error); }

    .q-chip {
      padding: 4px 10px;
      border: 1.5px solid var(--card-border);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .q-chip.active {
      border-color: var(--fg);
      color: var(--fg);
      background: rgba(26,26,24,0.04);
    }
    .q-chip:hover:not(.active) { border-color: var(--muted); }

    /* Error card */
    .card.card-error {
      border-color: rgba(196, 61, 61, 0.2);
      background: rgba(196, 61, 61, 0.03);
    }
    .card-error-icon {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(196, 61, 61, 0.08);
      color: var(--error);
    }
    .card-error-icon svg {
      width: 24px;
      height: 24px;
    }
    .card-error-msg {
      font-size: 0.72rem;
      color: var(--error);
      margin-top: 2px;
      line-height: 1.4;
    }
    .card-error-url {
      font-size: 0.65rem;
      color: var(--muted);
      word-break: break-all;
      margin-top: 4px;
    }

    .playlist-header {
      padding: 14px;
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      background: var(--card);
      margin-bottom: 10px;
    }

    /* Download all bar */
    .dl-all-bar {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .dl-all-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--fg);
      color: var(--bg);
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .dl-all-btn:hover { background: #2d2d2a; }
    .dl-all-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .spin {
      display: inline-block;
      width: 10px; height: 10px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.8;
    }

    .settings-link {
      color: var(--accent);
      cursor: pointer;
      background: none;
      border: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0;
      margin-left: 8px;
    }
    .settings-link:hover { text-decoration: underline; }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--card);
      border-radius: var(--radius);
      width: min(920px, 96vw);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      border: 1.5px solid var(--card-border);
    }
    .modal-header {
      padding: 18px 24px;
      border-bottom: 1.5px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-family: 'Instrument Serif', serif;
      font-size: 1.4rem;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }
    .modal-body {
      padding: 18px 24px;
      overflow-y: auto;
      flex: 1;
    }
    .modal-body .hint {
      margin-bottom: 12px;
      line-height: 1.6;
    }
    .modal-textarea {
      width: 100%;
      min-height: 420px;
      padding: 14px;
      border: 1.5px solid var(--card-border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      line-height: 1.5;
      resize: vertical;
    }
    .modal-footer {
      padding: 14px 24px;
      border-top: 1.5px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .modal-path {
      font-size: 0.65rem;
      color: var(--muted);
      word-break: break-all;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
    }

    /* Image grid (gallery-dl results) */
    .image-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      max-height: 70vh;
      overflow-y: auto;
      padding: 4px;
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      width: 100%;
    }
    .image-grid img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      background: var(--card-border);
    }
    .image-grid .img-tile { position: relative; }

    /* Mobile */
    @media (max-width: 500px) {
      .brand h1 { font-size: 3rem; }
      .page { padding: 40px 16px 60px; }
      .card { flex-direction: column; gap: 10px; }
      .card-thumb {
        width: 100%;
        min-width: unset;
        height: 160px;
      }
      .card-title { white-space: normal; }
      .controls { flex-wrap: wrap; }
      .fetch-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand">
      <h1>Re<em>Clip</em><span class="plus">+</span></h1>
      <p>Media downloader &middot; transcribe &middot; summarize &middot; translate</p>
    </div>

    <div class="input-section">
    <textarea id="urls" placeholder="Paste one or more URLs..." rows="2"></textarea>
    <p class="hint">Multiple links? Separate with spaces, commas, or newlines.</p>

    <div class="controls">
      <div class="pill-group">
        <button class="pill active" data-format="video" onclick="setFormat(this)">Video</button>
        <button class="pill" data-format="audio" onclick="setFormat(this)">Audio</button>
      </div>
      <button class="fetch-btn" id="goBtn" onclick="go()">Fetch</button>
    </div>
    </div>

    <div id="cards" class="cards"></div>

    <div class="footer" id="configFooter"></div>

    <div class="footer">
      YouTube &middot; TikTok &middot; Instagram &middot; Twitter/X &middot; Reddit &middot; Facebook<br>
      Vimeo &middot; Twitch &middot; Dailymotion &middot; SoundCloud &middot; Loom &middot; Streamable<br>
      Pinterest &middot; Tumblr &middot; Threads &middot; LinkedIn &middot; 1000+ more
    </div>
  </div>

  <script>
    let currentFormat = 'video';
    let cardData = [];
    // Keep internal operation/cache IDs stable while presenting the action the
    // user invoked. `speakers` predates the visible Diarize control.
    const builtinOpLabels = { speakers: 'Diarize' };

    function setFormat(btn) {
      document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFormat = btn.dataset.format;
    }

    function parseUrls(text) {
      return [...new Set(text.split(/[\s,]+/).map(u => u.trim()).filter(u => u.startsWith('http')))];
    }

    function fmtDur(s) {
      if (!s) return '';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function friendlyError(err) {
      // Gallery auth failures carry an actionable first line from the server.
      // Preserve it before generic 403 mapping and length truncation erase the
      // distinction between "not configured" and "browser not logged in".
      if (err.includes('Gallery authentication required:')) return err.split('\n')[0];
      if (err.includes('Unsupported URL')) return 'This URL is not supported';
      if (err.includes('Video unavailable')) return 'Video is unavailable or private';
      if (err.includes('Private video')) return 'This video is private';
      if (err.includes('HTTP Error 403')) return 'Access denied by the platform';
      if (err.includes('HTTP Error 404')) return 'Video not found';
      if (err.includes('copyright')) return 'Video blocked due to copyright';
      if (err.includes('geo')) return 'Video not available in your region';
      if (err.includes('timed out') || err.includes('Timed out')) return 'Request timed out — try again';
      if (err.includes('network') || err.includes('Network')) return 'Network error — check your connection';
      return err.length > 80 ? err.slice(0, 80) + '...' : err;
    }

    document.getElementById('urls').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }
    });

    async function go() {
      const urls = parseUrls(document.getElementById('urls').value);
      if (!urls.length) return;

      const btn = document.getElementById('goBtn');
      const container = document.getElementById('cards');
      btn.disabled = true;
      btn.textContent = 'Loading...';
      // Don't wipe — cached entries below stay; new cards prepend on top.

      // Check if youtube playlist URL
      for (let i = 0; i < urls.length; i++) {
        if (urls[i].includes('list=')) {
          const res = await fetch('/api/playlist', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: urls[i] }),
          });
          const data = await res.json();
          if (data.urls) {
            // replace playlist URL with individual video URLs
            urls.splice(i, 1, ...data.urls);
          }
        }
      }

      for (let i = 0; i < urls.length; i++) {
        const url = urls[i];

        // Check if it's a playlist URL
        if (url.includes('playlist?list=') || url.includes('/sets/') || url.includes('&list=')) {
          await loadPlaylist(url, container);
          continue;
        }

        const idx = cardData.length;
        cardData.push({ url, status: 'loading' });
        renderCard(idx);
        // Move the freshly-rendered card to the top of the list.
        const newEl = document.getElementById(`card-${idx}`);
        if (newEl) container.prepend(newEl);

        try {
          const res = await fetch('/api/info', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url }),
          });
          const data = await res.json();
          if (data.error) {
            cardData[idx] = { ...cardData[idx], status: 'info-error', error: data.error };
          } else if (data.kind === 'images') {
            cardData[idx] = {
              ...cardData[idx],
              status: 'ready',
              kind: 'images',
              items: data.items || [],
              entryHash: data.entry_hash || '',
              title: '',
              uploader: '',
            };
          } else {
            cardData[idx] = {
              ...cardData[idx],
              status: 'ready',
              kind: 'video',
              title: data.title || '',
              thumbnail: data.thumbnail || '',
              duration: data.duration,
              uploader: data.uploader || '',
              formats: data.formats || [],
              selectedFormatId: data.formats?.[0]?.id || null,
            };
          }
        } catch (err) {
          cardData[idx] = { ...cardData[idx], status: 'info-error', error: err.message };
        }
        renderCard(idx);
      }

      // Only count freshly-fetched cards (not cached recents) for "Download All".
      if (cardData.filter(c => c && c.status === 'ready' && !c.cacheEntry).length > 1) {
        renderDownloadAll();
      }

      btn.disabled = false;
      btn.textContent = 'Fetch';
    }

    function renderCard(idx) {
      const c = cardData[idx];
      if (!c) return;  // entry may have been deleted
      let el = document.getElementById(`card-${idx}`);
      if (!el) {
        el = document.createElement('div');
        el.id = `card-${idx}`;
        el.className = 'card';
        document.getElementById('cards').appendChild(el);
      }

      // Snapshot any live <audio> elements before innerHTML replaces them.
      // Each audio carries data-op="<op-name>"; we restore currentTime/paused
      // after the rebuild and suppress `autoplay` on restored ones so they
      // don't jump back to 0. New audio elements (op not in snapshot) keep
      // their initial autoplay behavior.
      const audioState = {};
      el.querySelectorAll('audio[data-op]').forEach(a => {
        audioState[a.dataset.op] = {
          currentTime: a.currentTime,
          paused: a.paused,
        };
      });

      // Loading skeleton
      if (c.status === 'loading') {
        el.className = 'card';
        el.innerHTML = `
          <div class="card-thumb loading"></div>
          <div class="card-body">
            <div class="skeleton-line medium"></div>
            <div class="skeleton-line short"></div>
          </div>
        `;
        return;
      }

      // Error state
      if (c.status === 'info-error') {
        el.className = 'card card-error';
        el.innerHTML = `
          <div class="card-thumb">
            <div class="card-error-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
          </div>
          <div class="card-body">
            <div class="card-title" style="color:var(--error)">Could not fetch media</div>
            <div class="card-error-msg">${esc(friendlyError(c.error || ''))}</div>
            <div class="card-error-url">${esc(c.url)}</div>
          </div>
        `;
        return;
      }

      // Image-grid layout for gallery-dl results
      if (c.kind === 'images') {
        el.className = 'card';
        const tiles = (c.items || []).map(it =>
          `<div class="img-tile"><a href="${esc(it.url)}" target="_blank" rel="noopener noreferrer"><img src="${esc(it.url)}" alt="${esc(it.filename || '')}" loading="lazy"></a></div>`
        ).join('');
        const dlUrl = c.entryHash ? `/api/download-all/${esc(c.entryHash)}` : '';
        const itemCount = (c.items || []).length || c.itemCount || 0;
        const placeholder = (itemCount === 0 && c.cacheEntry)
          ? `<p class="hint" style="margin:0;font-size:0.7rem;">Metadata only &mdash; click Download All to fetch images.</p>`
          : '';
        el.innerHTML = `
          <div class="card-body" style="width:100%;">
            <div class="card-meta">${esc(c.title || c.url)}${itemCount ? ` &middot; ${itemCount} images &middot; long-press / right-click to save individually` : ''}</div>
            ${placeholder}
            <div class="image-grid">${tiles}</div>
            <div class="card-actions" style="margin-top:10px;">
              ${dlUrl ? `<a class="card-dl-btn" href="${dlUrl}" download>Download All (zip)</a>` : ''}
            </div>
            ${renderCacheControls(idx, c)}
          </div>
        `;
        return;
      }

      // Ready / downloading / done / error states
      el.className = 'card';
      const isAudio = currentFormat === 'audio';

      let thumbHtml;
      if (isAudio) {
        thumbHtml = `<div class="no-thumb" style="color:var(--accent)"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>`;
      } else if (c.thumbnail) {
        thumbHtml = `<img src="${c.thumbnail}" alt="">`;
      } else {
        thumbHtml = `<div class="no-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>`;
      }

      let qualityChips = '';
      if (!isAudio && c.formats && c.formats.length > 1) {
        qualityChips = c.formats.map(f =>
          `<button class="q-chip${f.id === c.selectedFormatId ? ' active' : ''}" onclick="pickFormat(${idx}, '${f.id}')">${f.label}</button>`
        ).join('');
      }

      let actionHtml = '';
      if (c.status === 'ready') {
        actionHtml = `<button class="card-dl-btn" onclick="dlCard(${idx})">Download</button>
          <button class="card-dl-btn card-btn-alt" onclick="transcribeCard(${idx})">Transcribe</button>
          <button class="card-dl-btn card-btn-alt" onclick="speakersCard(${idx})" title="Do an extra pass to identify individual speakers when there are more than 1.">Diarize</button>
          ${actionButtonsHtml(idx)}
          ${qualityChips}`;
      } else if (c.status === 'downloading') {
        actionHtml = `<span class="card-status downloading"><span class="spin"></span> Downloading...</span>`;
      } else if (c.status === 'done') {
        actionHtml = `<button class="card-dl-btn done" onclick="saveCard(${idx})">Save</button>
          <span class="card-status done">${esc(c.filename || '')}</span>`;
      } else if (c.status === 'error') {
        actionHtml = `<button class="card-dl-btn" onclick="dlCard(${idx})">Retry</button>
          <span class="card-status error">${esc(friendlyError(c.error || 'Download failed'))}</span>`;
      }

      // Per-operation status indicators
      let opsHtml = '';
      for (const op of ['transcribe', 'speakers', ...actionDefs.map(a => a.id)]) {
        const opState = c.ops?.[op];
        if (!opState) continue;
        const def_ = actionDefs.find(a => a.id === op);
        const label = def_ ? def_.name : (builtinOpLabels[op] || op.replace(/_/g, ' '));
        const sourceLabel = opState.filename?.includes('-diarized') ? ' (diarized)' : '';
        if (opState.status === 'processing') {
          opsHtml += `<div class="card-status downloading"><span class="spin"></span> ${label}...</div>`;
        } else if (opState.status === 'done') {
          const text = opState.text || '';
          const isLong = text.length > 500;
          const expanded = opState.expanded || false;
          const btnStyle = 'padding:3px 10px;font-size:0.65rem;';
          const listenHtml = opState.audioLoading
            ? `<span class="card-status downloading" style="font-size:0.6rem;"><span class="spin"></span> Generating audio...</span>`
            : `<button class="card-dl-btn done" style="${btnStyle}" onclick="listenText(${idx},'${op}')">&#128264; Listen</button>`;
          const audioPlayerHtml = opState.audioUrl
            ? `<div style="margin-top:6px;display:flex;gap:6px;align-items:center;">
                <audio data-op="${op}" controls ${audioState[op] ? '' : 'autoplay'} style="flex:1;height:32px;min-width:0;" src="${opState.audioUrl}"></audio>
                <button class="card-dl-btn done" style="${btnStyle}white-space:nowrap;" onclick="downloadAudio(${idx},'${op}','mp3')">MP3</button>
                <button class="card-dl-btn done" style="${btnStyle}white-space:nowrap;" onclick="downloadAudio(${idx},'${op}','wav')">WAV</button>
              </div>`
            : '';
          const audioErrorHtml = (opState.audioError && !opState.audioLoading && !opState.audioUrl)
            ? `<div class="card-status error" style="margin-top:6px;font-size:0.6rem;line-height:1.4;">TTS: ${esc(opState.audioError)}</div>`
            : '';
          opsHtml += `<div class="op-result">
            <div class="op-result-header">
              <span class="op-result-label">${label}${sourceLabel}</span>
              <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
                ${opState.audioUrl ? '' : listenHtml}
                <button class="card-dl-btn done copy-btn" data-op="${op}" style="${btnStyle}" onclick="copyText(${idx},'${op}')">Copy</button>
                ${isLong ? `<button class="card-dl-btn done" style="${btnStyle}" onclick="toggleExpand(${idx},'${op}')">${expanded ? 'Collapse' : 'Expand'}</button>` : ''}
                <button class="card-dl-btn done" style="${btnStyle}" onclick="saveText(${idx}, '${op}')">Save</button>
              </div>
            </div>
            ${audioPlayerHtml}
            ${audioErrorHtml}
            <div class="op-result-text${expanded ? ' expanded' : ''}">${esc(text)}</div>
          </div>`;
        } else if (opState.status === 'error') {
          opsHtml += `<span class="card-status error">${label}: ${esc(opState.error || 'Failed')}</span>`;
        }
      }

      let paramsHtml = '';
      if (c.showParamsFor) {
        const def = actionDefs.find(a => a.id === c.showParamsFor);
        if (def) {
          const inputs = def.params.map(p => `
            <input type="text" id="param-${idx}-${esc(p.name)}" value="${esc(c.lastParams?.[p.name] || '')}"
              placeholder="${esc(p.label || p.name)}" style="padding:5px 10px;border:1.5px solid var(--card-border);border-radius:7px;
              font-family:'DM Mono',monospace;font-size:0.7rem;width:130px;background:var(--card);color:var(--fg);">`).join('');
          paramsHtml = `
            <div class="translate-panel" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
              ${inputs}
              <button class="card-dl-btn card-btn-alt" onclick="runActionWithParams(${idx}, '${esc(def.id)}')">${esc(def.name)}</button>
            </div>`;
        }
      }

      el.innerHTML = `
        <div class="card-thumb">${thumbHtml}</div>
        <div class="card-body">
          <div class="card-title">${esc(c.title || 'Untitled')}</div>
          <div class="card-meta">${esc(c.uploader)}${c.duration ? ' · ' + fmtDur(c.duration) : ''}</div>
          <div class="card-actions">${actionHtml}</div>
          ${paramsHtml}
          <div class="card-ops" style="margin-top:6px;display:flex;flex-direction:column;gap:4px;">${opsHtml}</div>
          ${renderCacheControls(idx, c)}
        </div>
      `;

      // Restore playback state on audio elements that survived the rebuild.
      el.querySelectorAll('audio[data-op]').forEach(a => {
        const saved = audioState[a.dataset.op];
        if (!saved) return;
        try { a.currentTime = saved.currentTime; } catch (_) {}
        if (!saved.paused) a.play().catch(() => {});
      });
    }

    // ----- Cache controls (Pin / Delete / Reveal) shown for any card backed
    // by a real cache entry. Loopback-only users also see "Show in Finder" /
    // "Open Folder". Uses absolute time deltas relative to last_accessed.
    function fmtSize(mb) {
      if (mb >= 1024) return (mb / 1024).toFixed(1) + ' GB';
      if (mb >= 1) return mb.toFixed(1) + ' MB';
      return Math.round(mb * 1024) + ' KB';
    }
    function fmtAgo(epochSec) {
      if (!epochSec) return '';
      const dt = Date.now() / 1000 - epochSec;
      if (dt < 60) return 'just now';
      if (dt < 3600) return Math.round(dt / 60) + 'm ago';
      if (dt < 86400) return Math.round(dt / 3600) + 'h ago';
      const days = Math.round(dt / 86400);
      if (days < 30) return days + 'd ago';
      const mo = Math.round(days / 30);
      return mo + 'mo ago';
    }
    function renderCacheControls(idx, c) {
      const ce = c.cacheEntry;
      if (!ce) return '';
      const pinLabel = ce.pinned ? 'Pinned' : 'Pin';
      const pinTitle = ce.pinned ? 'Click to unpin (LRU eviction can purge it)' : 'Pin to keep this entry safe from cache eviction';
      const revealLabel = _platform === 'darwin' ? 'Show in Finder' : 'Open Folder';
      const revealBtn = _settingsLoopback && (_platform === 'darwin' || _platform === 'linux')
        ? `<button class="card-dl-btn card-btn-alt" style="font-size:0.6rem;padding:3px 9px;" onclick="revealCacheEntry(${idx})">${revealLabel}</button>`
        : '';
      const sizeStr = fmtSize(ce.size_mb || 0);
      const agoStr = fmtAgo(ce.last_accessed);
      return `
        <div class="cache-controls" style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--card-border);display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
          <button class="card-dl-btn ${ce.pinned ? 'done' : 'card-btn-alt'}" title="${pinTitle}" style="font-size:0.6rem;padding:3px 9px;" onclick="togglePinCacheEntry(${idx})">${pinLabel}</button>
          <button class="card-dl-btn card-btn-alt" style="font-size:0.6rem;padding:3px 9px;" onclick="deleteCacheEntry(${idx})">Delete</button>
          ${revealBtn}
          <span class="hint" style="margin-left:auto;font-size:0.6rem;">${esc(sizeStr)}${agoStr ? ' · ' + esc(agoStr) : ''}</span>
        </div>`;
    }

    async function togglePinCacheEntry(idx) {
      const c = cardData[idx];
      const ce = c?.cacheEntry;
      if (!ce) return;
      const newPinned = !ce.pinned;
      try {
        const r = await fetch(`/api/cache/entry/${ce.entry_hash}/pin`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pinned: newPinned }),
        });
        if (!r.ok) return;
        cardData[idx].cacheEntry.pinned = newPinned;
        renderCard(idx);
      } catch (_) {}
    }

    async function deleteCacheEntry(idx) {
      const c = cardData[idx];
      const ce = c?.cacheEntry;
      if (!ce) return;
      const label = c.title || c.url || ce.entry_hash;
      if (!confirm(`Delete cached entry?\n\n${label}`)) return;
      try {
        const r = await fetch(`/api/cache/entry/${ce.entry_hash}`, { method: 'DELETE' });
        if (!r.ok) return;
        // Remove the card from the DOM and from cardData
        const el = document.getElementById(`card-${idx}`);
        if (el) el.remove();
        cardData[idx] = null;
      } catch (_) {}
    }

    async function revealCacheEntry(idx) {
      const ce = cardData[idx]?.cacheEntry;
      if (!ce) return;
      try {
        await fetch(`/api/cache/entry/${ce.entry_hash}/reveal`, { method: 'POST' });
      } catch (_) {}
    }

    async function clearAllCache() {
      const keepPinned = confirm('Keep pinned entries?\n\nOK = clear unpinned only, Cancel = clear EVERYTHING.');
      if (!confirm(keepPinned ? 'Clear all unpinned cache entries?' : 'Clear ENTIRE cache (including pinned)?')) return;
      try {
        const r = await fetch('/api/cache/clear', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ keep_pinned: keepPinned }),
        });
        if (!r.ok) return;
        // Wipe affected cards; reload entries
        document.getElementById('cards').innerHTML = '';
        cardData = [];
        await loadCacheEntries();
      } catch (_) {}
    }

    function renderDownloadAll() {
      const existing = document.getElementById('dl-all-bar');
      if (existing) existing.remove();

      const bar = document.createElement('div');
      bar.id = 'dl-all-bar';
      bar.className = 'dl-all-bar';
      bar.innerHTML = `<button class="dl-all-btn" onclick="dlAll()">Download All</button>`;
      document.getElementById('cards').appendChild(bar);
    }

    async function loadPlaylist(url, container) {
      const headerEl = document.createElement('div');
      headerEl.className = 'playlist-header';
      headerEl.innerHTML = '<span class="card-status downloading"><span class="spin"></span> Loading playlist...</span>';
      container.appendChild(headerEl);

      try {
        const res = await fetch('/api/playlist', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (data.error) {
          headerEl.innerHTML = `<span class="card-status error">Playlist error: ${esc(data.error)}</span>`;
          return;
        }

        const entries = data.entries || [];
        headerEl.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
            <span style="font-family:'Instrument Serif',serif;font-size:1.1rem;">Playlist — ${entries.length} videos</span>
            <div style="display:flex;gap:6px;">
              <button class="card-dl-btn" onclick="batchOp('download')">Download All</button>
              <button class="card-dl-btn card-btn-alt" onclick="batchOp('transcribe')">Transcribe All</button>
              <button class="card-dl-btn card-btn-alt" onclick="batchOp('summarize')">Summarize All</button>
            </div>
          </div>`;

        for (const entry of entries) {
          const idx = cardData.length;
          cardData.push({
            url: entry.url,
            status: 'ready',
            title: entry.title || '',
            thumbnail: entry.thumbnail || '',
            duration: entry.duration,
            uploader: '',
            formats: [],
            selectedFormatId: null,
          });
          renderCard(idx);
        }
      } catch (err) {
        headerEl.innerHTML = `<span class="card-status error">${esc(err.message)}</span>`;
      }
    }

    async function batchOp(op) {
      for (let i = 0; i < cardData.length; i++) {
        if (cardData[i].status !== 'ready') continue;
        if (op === 'download') await dlCard(i);
        else if (op === 'transcribe') await transcribeCard(i);
        else if (op === 'summarize') await runAction(i, 'summarize', {});
      }
    }

    function pickFormat(idx, formatId) {
      cardData[idx].selectedFormatId = formatId;
      renderCard(idx);
    }

    async function dlCard(idx) {
      const c = cardData[idx];
      c.status = 'downloading';
      c.error = null;
      renderCard(idx);

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: c.url,
            format: currentFormat,
            format_id: c.selectedFormatId,
            title: c.title || '',
          }),
        });
        const data = await res.json();
        if (data.error) {
          c.status = 'error';
          c.error = data.error;
          renderCard(idx);
          return;
        }
        c.jobId = data.job_id;
        pollCard(idx);
      } catch (err) {
        c.status = 'error';
        c.error = err.message;
        renderCard(idx);
      }
    }

    function pollCard(idx) {
      const c = cardData[idx];
      if (typeof EventSource !== 'undefined') {
        const es = new EventSource(`/api/stream/${c.jobId}`);
        es.onmessage = (e) => {
          const data = JSON.parse(e.data);
          if (data.status === 'done') {
            es.close();
            c.status = 'done';
            c.filename = data.filename;
            renderCard(idx);
            saveCard(idx);
          } else if (data.status === 'error' || data.error) {
            es.close();
            c.status = 'error';
            c.error = data.error;
            renderCard(idx);
          }
        };
        es.onerror = () => {
          es.close();
          c.status = 'error';
          c.error = 'Lost connection to server';
          renderCard(idx);
        };
      } else {
        _pollFallback(`/api/status/${c.jobId}`, 1000, (data) => {
          if (data.status === 'done') {
            c.status = 'done'; c.filename = data.filename;
            renderCard(idx); saveCard(idx); return true;
          } else if (data.status === 'error') {
            c.status = 'error'; c.error = data.error;
            renderCard(idx); return true;
          }
        }, () => { c.status = 'error'; c.error = 'Lost connection'; renderCard(idx); });
      }
    }

    function saveCard(idx) {
      const c = cardData[idx];
      if (!c.jobId) return;
      const a = document.createElement('a');
      a.href = `/api/file/${c.jobId}`;
      a.download = c.filename || '';
      a.click();
    }

    async function dlAll() {
      const btn = document.querySelector('.dl-all-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Downloading...'; }

      for (let i = 0; i < cardData.length; i++) {
        if (cardData[i].status === 'ready') {
          await dlCard(i);
        }
      }

      if (btn) { btn.disabled = false; btn.textContent = 'Download All'; }
    }

    function toggleExpand(idx, opKey) {
      const op = cardData[idx].ops?.[opKey];
      if (op) op.expanded = !op.expanded;
      renderCard(idx);
    }

    async function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (_) {
          // Firefox can reject navigator.clipboard despite a user click.
        }
      }

      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        return document.execCommand('copy');
      } catch (_) {
        return false;
      } finally {
        document.body.removeChild(textarea);
      }
    }

    async function copyText(idx, opKey) {
      const op = cardData[idx].ops?.[opKey];
      if (!op || !op.text) return;
      const copied = await copyToClipboard(op.text);
      const btns = document.querySelectorAll(`#card-${idx} .copy-btn`);
      for (const btn of btns) {
        if (btn.dataset.op === opKey) {
          const label = copied ? 'Copied!' : 'Copy failed';
          btn.textContent = label;
          setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
          break;
        }
      }
    }

    function _opToSource(opKey, op) {
      // Map UI op key to the API speak-source token
      if (op?.filename?.endsWith('.txt')) return op.filename.slice(0, -4);
      const fixed = { transcribe: 'transcript', speakers: 'diarized',
                      summarize: 'summary', counterargue: 'counterargue' };
      if (fixed[opKey]) return fixed[opKey];
      const def = actionDefs.find(a => a.id === opKey);
      if (!def) return null;
      const slug = Object.keys(op?.params || {}).sort()
        .map(k => String(op.params[k]).toLowerCase().trim().replace(/ /g, '-'))
        .filter(Boolean).join('-');
      if (opKey === 'translate') return `summary-${slug}`;
      if (opKey === 'translate_transcript') return `translation-${slug}`;
      return `action-${opKey}${slug ? '-' + slug : ''}`;
    }

    async function listenText(idx, opKey) {
      const c = cardData[idx];
      const op = c.ops?.[opKey];
      if (!op) return;

      op.audioLoading = true;
      op.audioError = null;  // clear stale error on retry
      renderCard(idx);

      // Map op key to API source param
      const source = _opToSource(opKey, op);
      if (!source) {
        op.audioLoading = false;
        op.audioError = 'No speakable source for this result';
        renderCard(idx);
        return;
      }

      try {
        const res = await fetch('/api/speak', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: c.url, source }),
        });

        if (res.headers.get('content-type')?.includes('audio')) {
          // Direct cached audio returned
          const blob = await res.blob();
          op.audioUrl = URL.createObjectURL(blob);
          op.audioLoading = false;
          renderCard(idx);
        } else {
          // Got a job_id — need to poll then fetch audio
          const data = await res.json();
          if (data.error) {
            op.audioLoading = false;
            op.audioError = data.error;
            renderCard(idx);
            return;
          }
          pollSpeakJob(idx, opKey, data.job_id);
        }
      } catch (err) {
        op.audioLoading = false;
        op.audioError = err.message;
        renderCard(idx);
      }
    }

    function pollSpeakJob(idx, opKey, jobId) {
      const c = cardData[idx];
      const op = c.ops?.[opKey];
      if (!op) return;

      if (typeof EventSource !== 'undefined') {
        const es = new EventSource(`/api/stream/${jobId}`);
        es.onmessage = async (e) => {
          const data = JSON.parse(e.data);
          if (data.status === 'done') {
            es.close();
            // Fetch the audio file
            const res = await fetch(`/api/file/${jobId}`);
            const blob = await res.blob();
            op.audioUrl = URL.createObjectURL(blob);
            op.audioLoading = false;
            renderCard(idx);
          } else if (data.status === 'error' || data.error) {
            es.close();
            op.audioLoading = false;
            op.audioError = data.error || 'Speech generation failed';
            renderCard(idx);
          }
        };
        es.onerror = () => {
          es.close();
          op.audioLoading = false;
          op.audioError = op.audioError || 'Lost connection to TTS job';
          renderCard(idx);
        };
      } else {
        _pollFallback(`/api/status/${jobId}`, 2000, async (data) => {
          if (data.status === 'done') {
            const res = await fetch(`/api/file/${jobId}`);
            const blob = await res.blob();
            op.audioUrl = URL.createObjectURL(blob);
            op.audioLoading = false;
            renderCard(idx);
            return true;
          } else if (data.status === 'error') {
            op.audioLoading = false;
            op.audioError = data.error || 'Speech generation failed';
            renderCard(idx);
            return true;
          }
        }, () => {
          op.audioLoading = false;
          op.audioError = op.audioError || 'Lost connection to TTS job';
          renderCard(idx);
        });
      }
    }

    async function downloadAudio(idx, opKey, format) {
      const c = cardData[idx];
      const source = _opToSource(opKey, c.ops?.[opKey]);
      if (!source) return;
      try {
        const res = await fetch('/api/speak/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: c.url, source, format }),
        });
        if (!res.ok) return;
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${source}.${format}`;
        a.click();
        URL.revokeObjectURL(a.href);
      } catch {}
    }

    function _initOps(idx) {
      if (!cardData[idx].ops) cardData[idx].ops = {};
    }

    async function transcribeCard(idx) {
      const c = cardData[idx];
      _initOps(idx);
      c.ops.transcribe = { status: 'processing' };
      renderCard(idx);

      try {
        const res = await fetch('/api/transcribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: c.url, title: c.title || '' }),
        });
        const data = await res.json();
        if (data.error) {
          c.ops.transcribe = { status: 'error', error: data.error };
          renderCard(idx);
          return;
        }
        if (data.cached) {
          c.ops.transcribe = { status: 'done', text: data.text, jobId: null };
          renderCard(idx);
          return;
        }
        c.ops.transcribe.jobId = data.job_id;
        pollOp(idx, 'transcribe', data.job_id);
      } catch (err) {
        c.ops.transcribe = { status: 'error', error: err.message };
        renderCard(idx);
      }
    }

    // ---- Registry-driven actions (buttons generated from /api/actions) ----
    let actionDefs = [];
    let actionsLastError = null;

    async function loadActions() {
      try {
        const res = await fetch('/api/actions');
        const data = await res.json();
        actionDefs = data.actions || [];
        actionsLastError = data.last_error || null;
        renderActionsError();
        cardData.forEach((_, i) => renderCard(i));
      } catch (err) {
        console.warn('could not load actions:', err);
      }
    }

    function renderActionsError() {
      let el = document.getElementById('actions-error');
      if (!actionsLastError) { if (el) el.remove(); return; }
      if (!el) {
        el = document.createElement('div');
        el.id = 'actions-error';
        el.style.cssText = 'margin:10px 0;padding:8px 12px;border:1.5px solid var(--error);border-radius:9px;color:var(--error);font-size:0.7rem;';
        const cards = document.getElementById('cards');
        cards.parentNode.insertBefore(el, cards);
      }
      el.textContent = `actions.json: ${actionsLastError} — using last good configuration`;
    }

    function actionButtonsHtml(idx) {
      return actionDefs.map(def => {
        const onclick = def.params.length
          ? `toggleActionParams(${idx}, '${esc(def.id)}')`
          : `runAction(${idx}, '${esc(def.id)}', {})`;
        return `<button class="card-dl-btn card-btn-alt" onclick="${onclick}">${esc(def.name)}</button>`;
      }).join('\n          ');
    }

    function toggleActionParams(idx, actionId) {
      const c = cardData[idx];
      c.showParamsFor = c.showParamsFor === actionId ? null : actionId;
      renderCard(idx);
    }

    function runActionWithParams(idx, actionId) {
      const def = actionDefs.find(a => a.id === actionId);
      const params = {};
      for (const p of (def?.params || [])) {
        const input = document.getElementById(`param-${idx}-${p.name}`);
        params[p.name] = input ? input.value.trim() : '';
        if (p.required && !params[p.name]) {
          input?.focus();
          return;
        }
      }
      cardData[idx].lastParams = params;
      cardData[idx].showParamsFor = null;
      runAction(idx, actionId, params);
    }

    async function runAction(idx, actionId, params) {
      const c = cardData[idx];
      _initOps(idx);
      c.ops[actionId] = { status: 'processing', params: params };
      renderCard(idx);

      try {
        const res = await fetch(`/api/action/${encodeURIComponent(actionId)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: c.url, params: params }),
        });
        const data = await res.json();
        if (data.error) {
          c.ops[actionId] = { status: 'error', error: data.error };
          renderCard(idx);
          return;
        }
        if (data.cached) {
          c.ops[actionId] = {
            status: 'done', text: data.text, jobId: null,
            params: params, filename: data.filename,
          };
          renderCard(idx);
          return;
        }
        c.ops[actionId].jobId = data.job_id;
        pollOp(idx, actionId, data.job_id);
      } catch (err) {
        c.ops[actionId] = { status: 'error', error: err.message };
        renderCard(idx);
      }
    }

    async function speakersCard(idx) {
      const c = cardData[idx];
      _initOps(idx);
      c.ops.speakers = { status: 'processing' };
      renderCard(idx);

      try {
        const res = await fetch('/api/diarize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: c.url, title: c.title || '' }),
        });
        const data = await res.json();
        if (data.error) {
          c.ops.speakers = { status: 'error', error: data.error };
          renderCard(idx);
          return;
        }
        if (data.cached) {
          c.ops.speakers = { status: 'done', text: data.text, jobId: null };
          renderCard(idx);
          return;
        }
        c.ops.speakers.jobId = data.job_id;
        pollOp(idx, 'speakers', data.job_id);
      } catch (err) {
        c.ops.speakers = { status: 'error', error: err.message };
        renderCard(idx);
      }
    }

    function pollOp(idx, opKey, jobId) {
      const c = cardData[idx];
      if (typeof EventSource !== 'undefined') {
        const es = new EventSource(`/api/stream/${jobId}`);
        es.onmessage = (e) => {
          const data = JSON.parse(e.data);
          if (data.status === 'done') {
            es.close();
            c.ops[opKey] = { status: 'done', text: data.text, jobId, filename: data.filename };
            renderCard(idx);
          } else if (data.status === 'error' || data.error) {
            es.close();
            c.ops[opKey] = { status: 'error', error: data.error };
            renderCard(idx);
          }
        };
        es.onerror = () => {
          es.close();
          c.ops[opKey] = { status: 'error', error: 'Lost connection' };
          renderCard(idx);
        };
      } else {
        _pollFallback(`/api/status/${jobId}`, 2000, (data) => {
          if (data.status === 'done') {
            c.ops[opKey] = { status: 'done', text: data.text, jobId, filename: data.filename };
            renderCard(idx); return true;
          } else if (data.status === 'error') {
            c.ops[opKey] = { status: 'error', error: data.error };
            renderCard(idx); return true;
          }
        }, () => { c.ops[opKey] = { status: 'error', error: 'Lost connection' }; renderCard(idx); });
      }
    }

    function _pollFallback(url, startDelay, onData, onError) {
      let delay = startDelay;
      function tick() {
        fetch(url).then(r => r.json()).then(data => {
          if (!onData(data)) { delay = Math.min(delay * 1.5, 30000); setTimeout(tick, delay); }
        }).catch(onError);
      }
      setTimeout(tick, delay);
    }

    function saveText(idx, opKey) {
      const c = cardData[idx];
      const op = c.ops?.[opKey];
      if (!op) return;

      if (op.text) {
        const blob = new Blob([op.text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = op.filename || `${opKey}.txt`;
        a.click();
        URL.revokeObjectURL(a.href);
        return;
      }

      if (op.jobId) {
        const a = document.createElement('a');
        a.href = `/api/text/${op.jobId}`;
        a.download = op.filename || `${opKey}.txt`;
        a.click();
      }
    }

    let _settingsLoopback = false;
    let _platform = '';

    (async function loadConfigFooter() {
      try {
        const res = await fetch('/api/config');
        if (res.status !== 200) return;
        const data = await res.json();
        if (!data.cache) return;
        _settingsLoopback = true;
        const el = document.getElementById('configFooter');
        const info = `Cache: ${data.cache.location} (${data.cache.used_mb} MB / ${data.cache.max_mb} MB, ${data.cache.entry_count} entries)  \u2022  STT: ${data.stt_host}  \u2022  LLM: ${data.llm_host}`;
        el.innerHTML = esc(info) + `<button class="settings-link" onclick="openSettings()">Settings</button>`;
      } catch {}
    })();

    async function loadCacheEntries() {
      try {
        const [entriesRes, svcRes] = await Promise.all([
          fetch('/api/cache/entries'),
          fetch('/api/service').catch(() => null),
        ]);
        if (svcRes && svcRes.ok) {
          const svc = await svcRes.json();
          _platform = svc.platform || '';
        }
        if (!entriesRes.ok) return;
        const data = await entriesRes.json();
        const entries = data.entries || [];
        if (!entries.length) return;

        // Show a "Clear All" button only when there are cached entries.
        renderClearAllBar(entries.length);

        for (const e of entries) {
          const idx = cardData.length;
          const card = hydrateCacheEntry(e);
          cardData.push(card);
          renderCard(idx);
        }
      } catch (_) {}
    }

    function hydrateCacheEntry(e) {
      // Map a /api/cache/entries entry to a cardData record. Status is 'ready'
      // so the existing action buttons (Transcribe/Summarize/etc.) appear and
      // hit the cache fast-path on click.
      if (e.kind === 'images') {
        const items = (e.media_files || []).map(fname => ({
          filename: fname,
          url: `/media/${e.entry_hash}/${encodeURIComponent(fname)}`,
        }));
        return {
          url: e.url,
          status: 'ready',
          kind: 'images',
          items: items,
          itemCount: e.item_count || items.length,
          entryHash: e.entry_hash,
          title: e.title || e.url,
          uploader: e.uploader || '',
          cacheEntry: e,
        };
      }
      return {
        url: e.url,
        status: 'ready',
        kind: 'video',
        title: e.title || e.url,
        thumbnail: e.thumbnail || '',
        duration: e.duration || 0,
        uploader: e.uploader || '',
        formats: [],
        selectedFormatId: null,
        cacheEntry: e,
      };
    }

    function renderClearAllBar(count) {
      const existing = document.getElementById('clear-all-bar');
      if (existing) existing.remove();
      const bar = document.createElement('div');
      bar.id = 'clear-all-bar';
      bar.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 10px 0;padding:8px 12px;background:var(--card);border:1.5px solid var(--card-border);border-radius:9px;';
      bar.innerHTML = `
        <span class="hint" style="font-size:0.7rem;">${count} cached ${count === 1 ? 'entry' : 'entries'} (most recent first)</span>
        <button class="card-dl-btn card-btn-alt" style="font-size:0.7rem;padding:4px 10px;" onclick="clearAllCache()">Clear All</button>`;
      const cards = document.getElementById('cards');
      cards.parentNode.insertBefore(bar, cards);
    }

    // Kick off the recents + actions fetches once the script has parsed.
    loadCacheEntries();
    loadActions();

    async function openSettings() {
      if (!_settingsLoopback) return;
      const [settingsRes, serviceRes] = await Promise.all([
        fetch('/api/settings'),
        fetch('/api/service'),
      ]);
      if (!settingsRes.ok) return;
      const data = await settingsRes.json();
      const svc = serviceRes.ok ? await serviceRes.json() : null;

      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.id = 'settings-modal';
      backdrop.innerHTML = `
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-header">
            <div class="modal-title">Settings</div>
            <button class="modal-close" onclick="closeSettings()" aria-label="Close">\u2715</button>
          </div>
          <div class="modal-body">
            <p class="hint">Edit the config file directly. Uses shell-style <code>KEY=VALUE</code> with bash interpolation: <code>\${VAR}</code> or <code>\${VAR:-default}</code>. Changes take effect on the next API call (within ~5s). <strong>Note:</strong> <code>cache_dir</code> and <code>cache_max_mb</code> require a server restart.</p>
            <textarea class="modal-textarea" id="settings-textarea">${esc(data.content)}</textarea>
            <div id="service-section"></div>
          </div>
          <div class="modal-footer">
            <div class="modal-path">${esc(data.path)}</div>
            <div class="modal-actions">
              <button class="card-dl-btn card-btn-alt" onclick="closeSettings()">Cancel</button>
              <button class="fetch-btn" style="padding:8px 18px;" onclick="saveSettings()">Save</button>
            </div>
          </div>
        </div>`;
      backdrop.onclick = closeSettings;
      document.body.appendChild(backdrop);
      if (svc) renderServiceSection(svc);
    }

    function renderServiceSection(svc) {
      const el = document.getElementById('service-section');
      if (!el) return;
      if (!svc.supported) {
        el.innerHTML = `
          <div style="margin-top:20px;padding-top:18px;border-top:1.5px solid var(--card-border);">
            <div style="font-family:'Instrument Serif',serif;font-size:1.15rem;margin-bottom:6px;">Run as a Service</div>
            <p class="hint" style="margin:0;">Service installation is not supported on <code>${esc(svc.platform)}</code> (only macOS and Linux).</p>
          </div>`;
        return;
      }
      const running = svc.running ? '<span style="color:var(--success);">&#9679; running</span>' : '<span style="color:var(--muted);">&#9675; not running</span>';
      const installed = svc.installed ? 'installed' : 'not installed';
      const asSvc = svc.is_running_as_service ? '<span style="color:var(--success);">&#9679; running as service</span>' : '<span style="color:var(--muted);">running in foreground</span>';

      // State-aware action buttons. Three scenarios:
      //   1. Foreground, no service: "Install & hand off"
      //   2. Foreground, service installed (probably crash-looping waiting
      //      for the port): "Hand off to service" + "Uninstall"
      //   3. Running as service: "Restart server" + "Uninstall"
      let actionBtns;
      if (svc.is_running_as_service) {
        actionBtns = `
          <button class="card-dl-btn card-btn-alt" onclick="restartServer()">Restart Server</button>
          <button class="card-dl-btn card-btn-alt" onclick="serviceAction('uninstall')">Uninstall</button>`;
      } else if (svc.installed) {
        actionBtns = `
          <button class="card-dl-btn done" onclick="handoffToService()">Hand off to service</button>
          <button class="card-dl-btn card-btn-alt" onclick="serviceAction('uninstall')">Uninstall</button>`;
      } else {
        actionBtns = `
          <button class="card-dl-btn done" onclick="handoffToService()">Install &amp; hand off</button>
          <button class="card-dl-btn card-btn-alt" onclick="stopServer()" title="No supervisor — you'll need to relaunch from your terminal.">Stop Server</button>`;
      }

      el.innerHTML = `
        <div style="margin-top:20px;padding-top:18px;border-top:1.5px solid var(--card-border);">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
            <div>
              <div style="font-family:'Instrument Serif',serif;font-size:1.15rem;">Run as a Service</div>
              <p class="hint" style="margin:4px 0 0 0;">
                ${installed} &middot; ${running} &middot; ${asSvc} &middot; <code>${esc(svc.platform)}</code>
              </p>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">${actionBtns}</div>
          </div>
          ${svc.installed && svc.service_path ? `<p class="hint" style="margin-top:6px;font-size:0.6rem;"><code>${esc(svc.service_path)}</code></p>` : ''}
          <p class="hint" style="margin-top:10px;font-size:0.6rem;line-height:1.5;">
            "Hand off" writes the service file (if needed) and exits this foreground process so launchd/systemd takes over the port — the page will auto-reload once the service is up.
            "Restart Server" exits the supervised process; launchd/systemd respawns it within ~1 second.
            "Stop Server" exits without a supervisor; you'll need to relaunch with <code>python app.py</code>.
            The current <code>RECLIP_*</code> environment and <code>PATH</code> are baked into the service file at install time.
          </p>
          <div id="service-msg" style="margin-top:8px;font-size:0.7rem;"></div>
        </div>`;
    }

    async function serviceAction(action) {
      const msg = document.getElementById('service-msg');
      if (msg) msg.innerHTML = `<span class="card-status downloading"><span class="spin"></span> ${action === 'install' ? 'Installing' : 'Uninstalling'}...</span>`;
      try {
        const res = await fetch(`/api/service/${action}`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) {
          if (msg) msg.innerHTML = `<span style="color:var(--error);">${esc(data.error || res.statusText)}</span>`;
          return;
        }
        const statusRes = await fetch('/api/service');
        const statusData = await statusRes.json();
        renderServiceSection(statusData);
        const freshMsg = document.getElementById('service-msg');
        if (freshMsg) freshMsg.innerHTML = `<span style="color:var(--success);">Service ${action}ed successfully.</span>`;
      } catch (err) {
        if (msg) msg.innerHTML = `<span style="color:var(--error);">${esc(err.message)}</span>`;
      }
    }

    async function handoffToService() {
      const msg = document.getElementById('service-msg');
      if (msg) msg.innerHTML = `<span class="card-status downloading"><span class="spin"></span> Installing service…</span>`;
      try {
        // Install (idempotent) — launchd/systemd already loaded with KeepAlive,
        // so as soon as we exit the port frees and the service auto-spawns.
        const installRes = await fetch('/api/service/install', { method: 'POST' });
        if (!installRes.ok) {
          const err = await installRes.json().catch(() => ({}));
          if (msg) msg.innerHTML = `<span style="color:var(--error);">Install failed: ${esc(err.error || installRes.statusText)}</span>`;
          return;
        }
        if (msg) msg.innerHTML = `<span class="card-status downloading"><span class="spin"></span> Handing off — page will reload in ~3s…</span>`;
        await fetch('/api/restart', { method: 'POST' });
        // Foreground exits ~500ms after the response; supervisor takes over.
        // Poll for the new server to come up, then reload.
        scheduleHandoffReload();
      } catch (err) {
        if (msg) msg.innerHTML = `<span style="color:var(--error);">${esc(err.message)}</span>`;
      }
    }

    async function restartServer() {
      const msg = document.getElementById('service-msg');
      if (msg) msg.innerHTML = `<span class="card-status downloading"><span class="spin"></span> Restarting — page will reload…</span>`;
      try {
        await fetch('/api/restart', { method: 'POST' });
        scheduleHandoffReload();
      } catch (err) {
        if (msg) msg.innerHTML = `<span style="color:var(--error);">${esc(err.message)}</span>`;
      }
    }

    async function stopServer() {
      if (!confirm('Stop the foreground server? You will need to relaunch with python app.py from your terminal.')) return;
      const msg = document.getElementById('service-msg');
      if (msg) msg.innerHTML = `<span class="card-status">Stopping…</span>`;
      try {
        await fetch('/api/restart', { method: 'POST' });
        if (msg) msg.innerHTML = `<span style="color:var(--muted);">Server stopped. Relaunch from terminal.</span>`;
      } catch (err) {
        if (msg) msg.innerHTML = `<span style="color:var(--error);">${esc(err.message)}</span>`;
      }
    }

    function scheduleHandoffReload() {
      // Poll /api/service every second; once the new process answers,
      // reload the whole page so the user sees the fresh server.
      let tries = 0;
      const maxTries = 30;  // 30s max
      const tick = async () => {
        tries++;
        try {
          const r = await fetch('/api/service', { cache: 'no-store' });
          if (r.ok) {
            window.location.reload();
            return;
          }
        } catch (_) { /* still down — keep waiting */ }
        if (tries < maxTries) setTimeout(tick, 1000);
        else {
          const msg = document.getElementById('service-msg');
          if (msg) msg.innerHTML = `<span style="color:var(--error);">Server didn't come back within 30s. Reload manually.</span>`;
        }
      };
      setTimeout(tick, 1500);
    }

    function closeSettings() {
      const el = document.getElementById('settings-modal');
      if (el) el.remove();
    }

    async function saveSettings() {
      const textarea = document.getElementById('settings-textarea');
      if (!textarea) return;
      const content = textarea.value;
      try {
        const res = await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          alert('Save failed: ' + (err.error || res.statusText));
          return;
        }
        closeSettings();
        // Refresh the footer to reflect any changes
        const cfgRes = await fetch('/api/config');
        if (cfgRes.ok) {
          const d = await cfgRes.json();
          if (d.cache) {
            const el = document.getElementById('configFooter');
            const info = `Cache: ${d.cache.location} (${d.cache.used_mb} MB / ${d.cache.max_mb} MB, ${d.cache.entry_count} entries)  \u2022  STT: ${d.stt_host}  \u2022  LLM: ${d.llm_host}`;
            el.innerHTML = esc(info) + `<button class="settings-link" onclick="openSettings()">Settings</button>`;
          }
        }
      } catch (err) {
        alert('Save failed: ' + err.message);
      }
    }
  </script>
</body>
</html>
